services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wikidex
      POSTGRES_USER: wikidex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U wikidex]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://wikidex:${POSTGRES_PASSWORD}@db:5432/wikidex
      ALLOWED_HOSTS: localhost,127.0.0.1
      ALLOWED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      ENABLE_LEGACY_IMPORT: "0"
    depends_on:
      db:
        condition: service_healthy
  ingestion:
    build: .
    profiles: [sync]
    environment:
      DATABASE_URL: postgresql+psycopg://wikidex:${POSTGRES_PASSWORD}@db:5432/wikidex
      WIKIMEDIA_USER_AGENT: ${WIKIMEDIA_USER_AGENT:-Wikidex/1.0}
    command: [python, scripts/import_catalogue.py, worker, --interval, "86400"]
    depends_on:
      app:
        condition: service_started
volumes:
  database:
